[project]
name = "accounts-payable-agent"
version = "0.2.0"
readme = "README.md"
description = "Google ADK accounts payable assistant with source-bound extraction and human ledger gates"
requires-python = ">=3.12"
dependencies = ["google-adk==2.12.0", "google-genai==2.31.0", "httpx==0.28.1", "pydantic==2.14.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
payables = "accounts_payable.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accounts_payable"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "accounts_payable/sample_data"

[tool.hatch.build.targets.sdist]
include = ["firedrill", ".github", ".gitignore", "src", "data", "fixtures", "tests", "scripts", "scenarios", "README.md", "AGENTS.md", "PLAN.md", "COMPATIBILITY.md", ".env.example", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
