[project]
name = "accounts-payable-agent"
version = "0.1.0"
description = "Google ADK accounts payable assistant with approval and ledger gates"
requires-python = ">=3.12"
dependencies = ["google-adk==2.12.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accounts_payable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
