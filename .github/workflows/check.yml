name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --extra test
      - run: uv run --locked python scripts/generate_data.py --check
      - run: uv run --locked --extra test pytest -q
      - run: uv build
      - run: uv run --locked python scripts/check_distribution.py
